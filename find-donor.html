<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Donor - BloodConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- Navigation Bar -->

    <header>

        <nav class="navbar">

            <div class="logo">
                🩸 BloodConnect
            </div>

            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="register.html">Register</a>

                <a href="find-donor.html">Find Donor</a>

                <a href="dashboard.html">Dashboard</a>

                <a href="about.html">About</a>

            </div>

        </nav>

    </header>


    <!-- Find Donor Section -->

    <main>

        <section class="find-section">

            <h1>Find a Blood Donor</h1>

            <p>
                Search for available blood donors by blood group and city.
            </p>


            <!-- Search Area -->

            <div class="search-box">

                <div>

                    <label for="bloodGroup">
                        Blood Group
                    </label>

                    <select id="bloodGroup">

                        <option value="">
                            All Blood Groups
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>

                        <option value="B+">B+</option>
                        <option value="B-">B-</option>

                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>

                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <div>

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city"
                    >

                </div>


                <button
                    onclick="searchDonors()"
                    class="form-button search-button"
                >
                    Search Donors
                </button>

            </div>


            <!-- Results -->

            <h2 class="results-heading">
                Available Donors
            </h2>


            <div id="donorResults">

                <!-- Donors will appear here -->

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 BloodConnect | Online Blood Donor Registration Portal
        </p>

    </footer>


    <script src="js/find-donor.js"></script>

</body>

</html>
