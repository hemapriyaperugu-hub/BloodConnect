<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Donor - BloodConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- Navigation Bar -->

    <header>

        <nav class="navbar">

            <div class="logo">
                🩸 BloodConnect
            </div>

            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="register.html">Register</a>

                <a href="find-donor.html">Find Donor</a>

                <a href="dashboard.html">Dashboard</a>

                <a href="about.html">About</a>

            </div>

        </nav>

    </header>



    <!-- Registration Section -->

    <main>

        <section class="form-section">

            <h1>Donor Registration</h1>

            <p class="form-intro">
                Register as a blood donor and help save lives.
            </p>


            <form id="donorForm">


                <!-- Full Name -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >


                <!-- Age -->

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                >


                <!-- Gender -->

                <label for="gender">
                    Gender
                </label>

                <select id="gender">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <!-- Blood Group -->

                <label for="bloodGroup">
                    Blood Group
                </label>

                <select id="bloodGroup">

                    <option value="">
                        Select Blood Group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>

                    <option value="B+">B+</option>
                    <option value="B-">B-</option>

                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>

                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>


                <!-- Phone -->

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                >


                <!-- Email -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >


                <!-- City -->

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter your city"
                >


                <!-- Last Donation -->

                <label for="lastDonation">
                    Last Blood Donation Date
                </label>

                <input
                    type="date"
                    id="lastDonation"
                >


                <!-- Availability -->

                <label for="availability">
                    Availability
                </label>

                <select id="availability">

                    <option value="">
                        Select Availability
                    </option>

                    <option value="Available">
                        Available
                    </option>

                    <option value="Not Available">
                        Not Available
                    </option>

                </select>


                <!-- Submit -->

                <button
                    type="submit"
                    class="form-button"
                >
                    Register Donor
                </button>


            </form>

        </section>

    </main>



    <!-- Footer -->

    <footer>

        <p>
            © 2026 BloodConnect | Online Blood Donor Registration Portal
        </p>

    </footer>


    <script src="js/register.js"></script>

</body>

</html>
